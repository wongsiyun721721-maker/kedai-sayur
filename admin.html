<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>⚙️ 档主后台</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#16a34a;--green-light:#dcfce7;--green-dark:#14532d;--bg:#f0faf3;--card:#ffffff;--border:#d1fae5;--border2:#e5e7eb;--text:#111827;--muted:#6b7280;--red:#ef4444;--radius:14px;--radius-sm:9px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);min-height:100vh;}
body{max-width:480px;margin:0 auto;}

#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px;}
.login-icon{font-size:56px;margin-bottom:12px;}
.login-title{font-size:22px;font-weight:800;color:var(--green-dark);margin-bottom:6px;}
.login-sub{font-size:14px;color:var(--muted);margin-bottom:28px;font-weight:600;}
.login-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;}
.login-label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:8px;}
.login-input{width:100%;padding:12px 16px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-size:16px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;letter-spacing:3px;}
.login-input:focus{border-color:var(--green);}
.login-btn{width:100%;background:var(--green);color:white;border:none;border-radius:var(--radius-sm);padding:13px;font-size:16px;font-weight:800;cursor:pointer;margin-top:14px;font-family:inherit;}
.login-error{color:var(--red);font-size:13px;font-weight:700;margin-top:10px;text-align:center;display:none;}
.login-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;}

#admin-screen{display:none;}
.header{background:linear-gradient(135deg,#14532d 0%,#16a34a 100%);padding:16px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;}
.header-title{font-size:17px;font-weight:800;color:white;}
.logout-btn{background:rgba(255,255,255,0.2);border:none;color:white;border-radius:var(--radius-sm);padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}

.content{padding:16px;padding-bottom:80px;}
.section-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.section-card-title{font-size:13px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:14px;}

.wa-row{display:flex;gap:10px;align-items:flex-end;}
.wa-row .field{flex:1;}
.field label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;}
.field input,.field select{width:100%;padding:10px 12px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;}
.field input:focus,.field select:focus{border-color:var(--green);}
.save-btn{background:var(--green);color:white;border:none;border-radius:var(--radius-sm);padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.save-hint{font-size:12px;color:var(--muted);margin-top:8px;font-weight:600;}
.saved-tag{display:inline-block;background:var(--green-light);color:var(--green);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;margin-left:8px;}

/* search */
.search-bar{width:100%;padding:10px 14px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;margin-bottom:12px;}
.search-bar:focus{border-color:var(--green);}

.product-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.product-item:last-child{border-bottom:none;}
.product-item-info{flex:1;min-width:0;}
.product-item-name{font-size:14px;font-weight:700;color:var(--text);}
.product-item-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.toggle-btn{width:44px;height:24px;border-radius:12px;background:#d1d5db;border:none;position:relative;cursor:pointer;flex-shrink:0;transition:background 0.2s;}
.toggle-btn.on{background:var(--green);}
.toggle-btn::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:white;border-radius:50%;transition:left 0.2s;}
.toggle-btn.on::after{left:23px;}
.del-btn{background:none;border:1px solid #fecaca;border-radius:var(--radius-sm);color:var(--red);font-size:12px;cursor:pointer;padding:4px 8px;flex-shrink:0;font-family:inherit;font-weight:700;}

.add-form{background:var(--bg);border:1.5px dashed var(--border2);border-radius:var(--radius);padding:16px;margin-top:14px;}
.add-form-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:14px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-field{margin-bottom:10px;}
.form-field label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;}
.form-field input,.form-field select{width:100%;padding:9px 12px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);background:var(--card);outline:none;}
.form-field input:focus,.form-field select:focus{border-color:var(--green);}
.add-submit{width:100%;background:var(--green);color:white;border:none;border-radius:var(--radius-sm);padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}

.pw-row{display:flex;gap:10px;align-items:flex-end;}
.pw-row .field{flex:1;}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);padding:10px 16px;}
.back-btn{display:block;width:100%;padding:12px;background:var(--green);color:white;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:800;text-align:center;text-decoration:none;font-family:inherit;cursor:pointer;}

.cat-tag{display:inline-block;background:var(--green-light);color:var(--green-dark);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:800;margin-left:6px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-icon">🔐</div>
  <div class="login-title">档主后台</div>
  <div class="login-sub">Halaman Pemilik · Trang Chủ Tiệm</div>
  <div class="login-card">
    <label class="login-label">密码 / Kata Laluan / Mật khẩu</label>
    <input class="login-input" id="pw-input" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="login-btn" onclick="doLogin()">进入后台 →</button>
    <div class="login-error" id="login-error">密码错误 / Kata laluan salah / Sai mật khẩu</div>
  </div>
  <div class="login-hint">默认密码：1234（可在后台更改）</div>
</div>

<div id="admin-screen">
  <div class="header">
    <div class="header-title">⚙️ 档主后台</div>
    <button class="logout-btn" onclick="doLogout()">退出</button>
  </div>
  <div class="content">

    <div class="section-card">
      <div class="section-card-title">📱 WhatsApp 号码</div>
      <div class="wa-row">
        <div class="field">
          <label>号码（格式：60XXXXXXXXX）</label>
          <input id="wa-input" type="tel" placeholder="60123456789" />
        </div>
        <button class="save-btn" onclick="saveWA()">保存</button>
      </div>
      <div class="save-hint">客户点单自动发到此号码 <span class="saved-tag" id="wa-saved" style="display:none">✓ 已保存</span></div>
    </div>

    <div class="section-card">
      <div class="section-card-title">🥬 商品管理</div>
      <input class="search-bar" id="search-bar" placeholder="搜索商品..." oninput="renderProductList()" />
      <div id="product-list"></div>
      <div class="add-form">
        <div class="add-form-title">＋ 添加新商品</div>
        <div class="form-grid">
          <div class="form-field"><label>🇨🇳 中文名称 *</label><input id="n-zh" placeholder="菜心" /></div>
          <div class="form-field"><label>🇲🇾 BM</label><input id="n-ms" placeholder="Sawi" /></div>
        </div>
        <div class="form-field"><label>🇻🇳 Tiếng Việt</label><input id="n-vi" placeholder="Cải ngọt" /></div>
        <div class="form-grid">
          <div class="form-field"><label>分类</label>
            <select id="n-cat">
              <option value="local_dry">本地干菜</option>
              <option value="local_veg">本地菜</option>
              <option value="thai">泰国菜</option>
              <option value="cameron">金马仑菜</option>
              <option value="china">中国菜</option>
            </select>
          </div>
          <div class="form-field"><label>单位</label>
            <select id="n-unit">
              <option value="kg">kg</option>
              <option value="pkt">pkt</option>
              <option value="pcs">pcs</option>
              <option value="ns">ns</option>
              <option value="ikat">ikat</option>
            </select>
          </div>
        </div>
        <div class="form-field"><label>参考价格 RM（可留空）</label><input id="n-price" type="number" placeholder="2.50" step="0.10" min="0" /></div>
        <button class="add-submit" onclick="addProduct()">✓ 添加商品</button>
      </div>
    </div>

    <div class="section-card">
      <div class="section-card-title">🔑 更改密码</div>
      <div class="pw-row">
        <div class="field"><label>新密码（至少4位）</label><input id="new-pw" type="password" placeholder="输入新密码" /></div>
        <button class="save-btn" onclick="changePW()">更改</button>
      </div>
    </div>

  </div>
  <div class="bottom-nav">
    <a class="back-btn" href="index.html">← 返回点单页面</a>
  </div>
</div>

  {id:86,zh:'冬瓜',ms:'Tembikai Susu',vi:'Bí đông',cat:'china',unit:'kg',price:'',active:true},
  {id:87,zh:'莲藕',ms:'Ubi Teratai',vi:'Ngó sen',cat:'china',unit:'kg',price:'',active:true},
  {id:88,zh:'山药',ms:'Ubi Kayu Jepun',vi:'Khoai mài',cat:'china',unit:'kg',price:'',active:true},
  {id:89,zh:'粉葛',ms:'Ubi Kemili',vi:'Sắn dây',cat:'china',unit:'kg',price:'',active:true},
  {id:90,zh:'甜豆',ms:'Snap Pea',vi:'Đậu Hà Lan ngọt',cat:'china',unit:'pkt',price:'',active:true},

  {id:93,zh:'西芹',ms:'Saderi China',vi:'Cần tây TQ',cat:'china',unit:'kg',price:'',active:true},
];

const CAT_LABELS={local_dry:'本地干菜',local_veg:'本地菜',thai:'泰国菜',cameron:'金马仑菜',china:'中国菜'};

let products=[],nextId=100;

function getPassword(){return localStorage.getItem('kedai_pw')||'1234';}

function doLogin(){
  const pw=document.getElementById('pw-input').value;
  if(pw===getPassword()){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('admin-screen').style.display='block';
    loadAll();
  } else {
    document.getElementById('login-error').style.display='block';
    document.getElementById('pw-input').value='';
  }
}

function doLogout(){
  document.getElementById('admin-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pw-input').value='';
  document.getElementById('login-error').style.display='none';
}

function loadAll(){
  try{
    const s=localStorage.getItem('kedai_products');
    if(s){products=JSON.parse(s);nextId=Math.max(...products.map(p=>p.id),99)+1;}
    else{products=[...DEFAULT_PRODUCTS];saveProducts();}
  }catch(e){products=[...DEFAULT_PRODUCTS];saveProducts();}
  const wa=localStorage.getItem('kedai_wa')||'';
  document.getElementById('wa-input').value=wa;
  renderProductList();
}

function saveProducts(){localStorage.setItem('kedai_products',JSON.stringify(products));}

function saveWA(){
  const val=document.getElementById('wa-input').value.trim();
  if(!val){alert('请输入号码');return;}
  localStorage.setItem('kedai_wa',val);
  const tag=document.getElementById('wa-saved');
  tag.style.display='inline-block';
  setTimeout(()=>tag.style.display='none',2500);
}

function changePW(){
  const pw=document.getElementById('new-pw').value.trim();
  if(!pw||pw.length<4){alert('密码至少4位');return;}
  localStorage.setItem('kedai_pw',pw);
  document.getElementById('new-pw').value='';
  alert('密码已更改！');
}

function renderProductList(){
  const q=(document.getElementById('search-bar').value||'').toLowerCase();
  const container=document.getElementById('product-list');
  const filtered=products.filter(p=>
    !q||p.zh.includes(q)||p.ms.toLowerCase().includes(q)||p.vi.toLowerCase().includes(q)
  );
  if(!filtered.length){container.innerHTML='<div style="text-align:center;color:var(--muted);padding:20px;font-size:14px">没有找到商品</div>';return;}
  container.innerHTML='';
  filtered.forEach(p=>{
    const row=document.createElement('div');row.className='product-item';
    row.innerHTML=`
      <div class="product-item-info">
        <div class="product-item-name">${p.zh} <span class="cat-tag">${CAT_LABELS[p.cat]||p.cat}</span>${p.price?` <span style="color:var(--green);font-size:12px">RM${parseFloat(p.price).toFixed(2)}</span>`:''}</div>
        <div class="product-item-sub">${p.ms} · ${p.vi} · ${p.unit}</div>
      </div>
      <button class="toggle-btn ${p.active?'on':''}" onclick="toggleProduct(${p.id})"></button>
      <button class="del-btn" onclick="deleteProduct(${p.id})">删除</button>`;
    container.appendChild(row);
  });
}

function toggleProduct(id){const p=products.find(x=>x.id===id);if(p){p.active=!p.active;saveProducts();renderProductList();}}
function deleteProduct(id){if(!confirm('确定删除？'))return;products=products.filter(x=>x.id!==id);saveProducts();renderProductList();}

function addProduct(){
  const zh=document.getElementById('n-zh').value.trim();
  if(!zh){alert('请填写中文名称');return;}
  const ms=document.getElementById('n-ms').value.trim();
  const vi=document.getElementById('n-vi').value.trim();
  const price=document.getElementById('n-price').value;
  products.push({id:nextId++,zh,ms:ms||zh,vi:vi||zh,cat:document.getElementById('n-cat').value,unit:document.getElementById('n-unit').value,price,active:true});
  saveProducts();renderProductList();
  document.getElementById('n-zh').value='';document.getElementById('n-ms').value='';
  document.getElementById('n-vi').value='';document.getElementById('n-price').value='';
}
</script>
