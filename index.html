<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🥬 新鲜菜档 · Kedai Sayur · Rau Tươi</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #16a34a;
    --green-light: #dcfce7;
    --green-dark: #14532d;
    --wa: #25D366;
    --bg: #f8faf8;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); font-family: 'Nunito', sans-serif; color: var(--text); }
  body { max-width: 480px; margin: 0 auto; position: relative; }

  /* HEADER */
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header-left .shop-name { font-size: 17px; font-weight: 700; color: var(--green-dark); }
  .header-left .shop-hours { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .cart-btn {
    background: var(--wa);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
  }
  .cart-badge {
    background: white;
    color: var(--wa);
    border-radius: 50%;
    width: 20px; height: 20px;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* LANG BAR */
  .lang-bar {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .lang-btn {
    flex: 1;
    padding: 7px 0;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .lang-btn.active {
    background: var(--green);
    color: white;
    border-color: var(--green);
  }

  /* TABS */
  .tab-bar {
    display: flex;
    overflow-x: auto;
    padding: 0 16px;
    gap: 4px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
    position: sticky;
    top: 57px;
    z-index: 40;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 11px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 2.5px solid transparent;
    white-space: nowrap;
    font-family: inherit;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    transition: color 0.15s;
  }
  .tab.active { color: var(--green); border-bottom-color: var(--green); }

  /* SECTIONS */
  .sections { padding: 12px 16px 100px; }
  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* PRODUCT CARD */
  .product-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    transition: border-color 0.15s;
  }
  .product-card.in-cart { border-color: var(--green); }
  .product-info { flex: 1; min-width: 0; }
  .product-name { font-size: 15px; font-weight: 700; color: var(--text); }
  .product-alt { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .product-price { font-size: 12px; color: var(--green); font-weight: 600; margin-top: 2px; }

  /* QTY CONTROL */
  .qty-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .qty-control { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    width: 32px; height: 32px;
    border: 1.5px solid var(--border);
    border-radius: 50%;
    background: var(--bg);
    font-size: 20px;
    font-weight: 400;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    line-height: 1;
    transition: all 0.1s;
    font-family: inherit;
  }
  .qty-btn:active { background: var(--green-light); border-color: var(--green); transform: scale(0.93); }
  .qty-num { min-width: 28px; text-align: center; font-size: 16px; font-weight: 700; color: var(--text); }
  .qty-unit { font-size: 11px; color: var(--muted); text-align: center; }

  /* ADMIN LINK */
  .admin-link-wrap { text-align: center; padding: 24px 16px; }
  .admin-link-wrap a { color: var(--muted); font-size: 13px; text-decoration: none; }

  /* OVERLAY + CART PANEL */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; }
  .overlay.open { display: block; }
  .cart-panel {
    display: none;
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    border-top: 1px solid var(--border);
    padding: 20px 16px 24px;
    max-height: 75vh;
    overflow-y: auto;
    z-index: 101;
  }
  .cart-panel.open { display: block; }
  .cart-drag { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .cart-header { font-size: 17px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .close-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .cart-item-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .cart-item-qty { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .cart-empty { text-align: center; color: var(--muted); padding: 28px 0; font-size: 14px; }
  .name-row { margin: 16px 0 12px; }
  .name-row label { font-size: 13px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px; }
  .name-row input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    outline: none;
  }
  .name-row input:focus { border-color: var(--green); }
  .notes-row { margin-bottom: 14px; }
  .notes-row label { font-size: 13px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px; }
  .notes-row textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    outline: none;
    resize: none;
    height: 70px;
  }
  .notes-row textarea:focus { border-color: var(--green); }
  .send-btn {
    width: 100%;
    background: var(--wa);
    color: white;
    border: none;
    border-radius: var(--radius);
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn:active:not(:disabled) { opacity: 0.85; }
  .wa-svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* ADMIN VIEW */
  #admin-view { display: none; }
  .admin-header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 16px; position: sticky; top: 0; z-index: 50; }
  .admin-header-title { font-size: 17px; font-weight: 700; color: var(--green-dark); }
  .admin-content { padding: 16px; padding-bottom: 60px; }
  .admin-back {
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    margin-bottom: 16px;
    font-family: inherit;
  }
  .admin-section-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .admin-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }
  .admin-item-info { flex: 1; min-width: 0; }
  .admin-item-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .admin-item-sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toggle-btn {
    width: 42px; height: 24px;
    border-radius: 12px;
    background: #d1d5db;
    border: none;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .toggle-btn.on { background: var(--green); }
  .toggle-btn::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 18px; height: 18px;
    background: white;
    border-radius: 50%;
    transition: left 0.2s;
  }
  .toggle-btn.on::after { left: 21px; }
  .del-btn { background: none; border: none; color: #ef4444; font-size: 18px; cursor: pointer; padding: 0 2px; flex-shrink: 0; }
  .add-form {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 16px;
  }
  .add-form-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 14px; }
  .form-field { margin-bottom: 11px; }
  .form-field label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 5px; }
  .form-field input, .form-field select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--card);
    outline: none;
  }
  .form-field input:focus, .form-field select:focus { border-color: var(--green); }
  .add-submit {
    width: 100%;
    background: var(--green);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .add-submit:active { opacity: 0.85; }

  /* WHATSAPP NUMBER CONFIG */
  .wa-config {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
  }
  .wa-config label { font-size: 13px; font-weight: 600; color: #92400e; display: block; margin-bottom: 6px; }
  .wa-config input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #fcd34d;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: white;
    outline: none;
  }
  .wa-config input:focus { border-color: #f59e0b; }
  .wa-config-hint { font-size: 11px; color: #92400e; margin-top: 5px; }
</style>
</head>
<body>

<!-- MAIN VIEW -->
<div id="main-view">
  <div class="header">
    <div class="header-left">
      <div class="shop-name" id="h-title">🥬 新鲜菜档</div>
      <div class="shop-hours" id="h-sub">每天早上 5:00 营业</div>
    </div>
    <button class="cart-btn" onclick="openCart()">
      <span id="h-cart">购物车</span>
      <span class="cart-badge" id="cart-badge">0</span>
    </button>
  </div>

  <div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('zh',this)">中文</button>
    <button class="lang-btn" onclick="setLang('ms',this)">BM</button>
    <button class="lang-btn" onclick="setLang('vi',this)">Việt</button>
  </div>

  <div class="tab-bar" id="tab-bar"></div>

  <div class="sections" id="product-sections"></div>

  <div class="admin-link-wrap">
    <a href="#" onclick="showAdmin(event)" id="admin-link-text">⚙️ 商品管理（档主专用）</a>
  </div>
</div>

<!-- ADMIN VIEW -->
<div id="admin-view">
  <div class="admin-header">
    <div class="admin-header-title" id="admin-h-title">⚙️ 商品管理</div>
  </div>
  <div class="admin-content">
    <button class="admin-back" onclick="hideAdmin()" id="admin-back-btn">← 返回点单</button>

    <div class="wa-config">
      <label id="lbl-wa">档主 WhatsApp 号码</label>
      <input id="wa-number" type="tel" placeholder="60123456789" value="60123456789" />
      <div class="wa-config-hint" id="lbl-wa-hint">格式：国家码 + 号码，不要 + 号。例如：60123456789</div>
    </div>

    <div class="admin-section-title" id="admin-list-title">目前商品</div>
    <div id="admin-list"></div>

    <div class="add-form">
      <div class="add-form-title" id="add-form-title">添加新商品</div>
      <div class="form-field"><label id="lbl-zh">🇨🇳 中文名称 *</label><input id="new-name-zh" placeholder="例如：菜心" /></div>
      <div class="form-field"><label id="lbl-ms">🇲🇾 Nama BM</label><input id="new-name-ms" placeholder="cth: Sawi" /></div>
      <div class="form-field"><label id="lbl-vi">🇻🇳 Tên tiếng Việt</label><input id="new-name-vi" placeholder="vd: Cải ngọt" /></div>
      <div class="form-field"><label id="lbl-cat">分类 / Kategori / Danh mục</label>
        <select id="new-cat">
          <option value="vegetables">蔬菜 / Sayur / Rau củ</option>
          <option value="chilled">冷藏 / Sejuk Beku / Đông lạnh</option>
          <option value="dry">干货杂粮 / Kering / Hàng khô</option>
        </select>
      </div>
      <div class="form-field"><label id="lbl-unit">单位 / Unit / Đơn vị</label>
        <select id="new-unit">
          <option value="g">克 / g</option>
          <option value="条/batang/cái">条 / batang / cái</option>
          <option value="粒/biji/quả">粒 / biji / quả</option>
          <option value="斤/kati/cân">斤 / kati / cân</option>
          <option value="包/beg/gói">包 / beg / gói</option>
          <option value="瓶/botol/chai">瓶 / botol / chai</option>
          <option value="块/ketul/miếng">块 / ketul / miếng</option>
        </select>
      </div>
      <div class="form-field"><label id="lbl-price">参考价格 RM（可留空）</label><input id="new-price" type="number" placeholder="2.50" step="0.10" min="0" /></div>
      <button class="add-submit" id="add-btn" onclick="addProduct()">+ 添加商品</button>
    </div>
  </div>
</div>

<!-- OVERLAY + CART -->
<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cart-panel">
  <div class="cart-drag"></div>
  <div class="cart-header">
    <span id="cart-title">我的订单</span>
    <button class="close-btn" onclick="closeCart()">✕</button>
  </div>
  <div id="cart-items"></div>
  <div class="name-row">
    <label id="name-label">称呼</label>
    <input id="customer-name" placeholder="例如：阿花姐" />
  </div>
  <div class="notes-row">
    <label id="notes-label">备注</label>
    <textarea id="order-notes" placeholder="例如：不要太多泥，早点准备"></textarea>
  </div>
  <button class="send-btn" id="send-btn" onclick="sendWhatsApp()">
    <svg class="wa-svg" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    <span id="send-label">发送到 WhatsApp</span>
  </button>
</div>

<script>
const i18n = {
  zh: {
    title:'🥬 新鲜菜档', sub:'每天早上 5:00 营业', cart:'购物车',
    cartTitle:'我的订单', namePh:'例如：阿花姐', nameLabel:'称呼',
    notesLabel:'备注', notesPh:'例如：不要太多泥，早点准备',
    sendBtn:'发送到 WhatsApp', emptyCart:'还没有选商品哦 🛒',
    adminLink:'⚙️ 商品管理（档主专用）', adminTitle:'⚙️ 商品管理',
    backBtn:'← 返回点单', listTitle:'目前商品', addTitle:'添加新商品',
    addBtn:'+ 添加商品',
    waLabel:'档主 WhatsApp 号码',
    waHint:'格式：国家码 + 号码，不要 + 号。例如：60123456789',
    cats:{ vegetables:'蔬菜', chilled:'冷藏', dry:'干货杂粮' },
    waMsg:(name,time,items,notes)=>{
      let m = `📦 *新订单*\n👤 ${name}\n🕐 ${time}\n━━━━━━━━━━━━━━\n`;
      items.forEach(i=>{ m += `• ${i.name}：${i.qty} ${i.unit}\n`; });
      m += `━━━━━━━━━━━━━━`;
      if(notes) m += `\n📝 ${notes}`;
      m += `\n请确认 🙏`;
      return m;
    }
  },
  ms: {
    title:'🥬 Kedai Sayur Segar', sub:'Buka setiap pagi 5:00 pagi', cart:'Troli',
    cartTitle:'Pesanan Saya', namePh:'cth: Kak Maimun', nameLabel:'Nama',
    notesLabel:'Nota', notesPh:'cth: Kurang tanah, sedia awal',
    sendBtn:'Hantar ke WhatsApp', emptyCart:'Belum pilih barang lagi 🛒',
    adminLink:'⚙️ Pengurusan Barang (Pemilik)', adminTitle:'⚙️ Pengurusan Barang',
    backBtn:'← Kembali', listTitle:'Senarai Barang', addTitle:'Tambah Barang Baru',
    addBtn:'+ Tambah Barang',
    waLabel:'Nombor WhatsApp Pemilik',
    waHint:'Format: kod negara + nombor, tanpa +. Contoh: 60123456789',
    cats:{ vegetables:'Sayur-sayuran', chilled:'Sejuk Beku', dry:'Bahan Kering' },
    waMsg:(name,time,items,notes)=>{
      let m = `📦 *Pesanan Baru*\n👤 ${name}\n🕐 ${time}\n━━━━━━━━━━━━━━\n`;
      items.forEach(i=>{ m += `• ${i.name}：${i.qty} ${i.unit}\n`; });
      m += `━━━━━━━━━━━━━━`;
      if(notes) m += `\n📝 ${notes}`;
      m += `\nSila sahkan 🙏`;
      return m;
    }
  },
  vi: {
    title:'🥬 Cửa Hàng Rau Tươi', sub:'Mở cửa 5:00 sáng mỗi ngày', cart:'Giỏ hàng',
    cartTitle:'Đơn hàng của tôi', namePh:'vd: Chị Lan', nameLabel:'Tên',
    notesLabel:'Ghi chú', notesPh:'vd: Ít bùn, chuẩn bị sớm',
    sendBtn:'Gửi qua WhatsApp', emptyCart:'Chưa chọn hàng nào 🛒',
    adminLink:'⚙️ Quản lý hàng hóa (Chủ tiệm)', adminTitle:'⚙️ Quản lý hàng hóa',
    backBtn:'← Quay lại', listTitle:'Danh sách hàng', addTitle:'Thêm hàng mới',
    addBtn:'+ Thêm hàng',
    waLabel:'Số WhatsApp Chủ Tiệm',
    waHint:'Định dạng: mã quốc gia + số, không có +. Ví dụ: 60123456789',
    cats:{ vegetables:'Rau củ', chilled:'Đông lạnh', dry:'Hàng khô' },
    waMsg:(name,time,items,notes)=>{
      let m = `📦 *Đơn hàng mới*\n👤 ${name}\n🕐 ${time}\n━━━━━━━━━━━━━━\n`;
      items.forEach(i=>{ m += `• ${i.name}：${i.qty} ${i.unit}\n`; });
      m += `━━━━━━━━━━━━━━`;
      if(notes) m += `\n📝 ${notes}`;
      m += `\nXin xác nhận 🙏`;
      return m;
    }
  }
};

let lang = 'zh';

let products = [
  {id:1, zh:'菜心', ms:'Sawi', vi:'Cải ngọt', cat:'vegetables', unit:'g', price:'', active:true},
  {id:2, zh:'空心菜', ms:'Kangkung', vi:'Rau muống', cat:'vegetables', unit:'g', price:'', active:true},
  {id:3, zh:'豆角', ms:'Kacang Panjang', vi:'Đậu đũa', cat:'vegetables', unit:'g', price:'', active:true},
  {id:4, zh:'黄瓜', ms:'Timun', vi:'Dưa leo', cat:'vegetables', unit:'条/batang/cái', price:'', active:true},
  {id:5, zh:'西红柿', ms:'Tomato', vi:'Cà chua', cat:'vegetables', unit:'粒/biji/quả', price:'', active:true},
  {id:6, zh:'大葱', ms:'Daun Bawang', vi:'Hành lá', cat:'vegetables', unit:'斤/kati/cân', price:'', active:true},
  {id:7, zh:'大白菜', ms:'Kobis Putih', vi:'Bắp cải trắng', cat:'vegetables', unit:'g', price:'', active:true},
  {id:8, zh:'苦瓜', ms:'Peria', vi:'Khổ qua', cat:'vegetables', unit:'条/batang/cái', price:'', active:true},
  {id:9, zh:'鸡蛋', ms:'Telur Ayam', vi:'Trứng gà', cat:'chilled', unit:'粒/biji/quả', price:'', active:true},
  {id:10, zh:'豆腐', ms:'Tauhu', vi:'Đậu hũ', cat:'chilled', unit:'块/ketul/miếng', price:'', active:true},
  {id:11, zh:'白米', ms:'Beras Putih', vi:'Gạo trắng', cat:'dry', unit:'斤/kati/cân', price:'', active:true},
  {id:12, zh:'花生油', ms:'Minyak Kacang', vi:'Dầu đậu phộng', cat:'dry', unit:'瓶/botol/chai', price:'', active:true},
];
let nextId = 13;
let cart = {};

const unitSteps = {
  'g':[100,200,250,500],
  '条/batang/cái':[1,2,5],
  '粒/biji/quả':[1,2,5,10],
  '斤/kati/cân':[1,2,3,5],
  '包/beg/gói':[1,2,3],
  '瓶/botol/chai':[1,2],
  '块/ketul/miếng':[1,2,3]
};

function pName(p){ return p[lang] || p.zh; }

function pUnit(u){
  if(u==='g') return 'g';
  const parts = u.split('/');
  if(lang==='zh') return parts[0];
  if(lang==='ms') return parts[1]||parts[0];
  if(lang==='vi') return parts[2]||parts[0];
  return parts[0];
}

function setLang(l, btn){
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyLang();
  renderTabs();
  renderProducts();
}

function applyLang(){
  const t = i18n[lang];
  document.getElementById('h-title').textContent = t.title;
  document.getElementById('h-sub').textContent = t.sub;
  document.getElementById('h-cart').textContent = t.cart;
  document.getElementById('cart-title').textContent = t.cartTitle;
  document.getElementById('customer-name').placeholder = t.namePh;
  document.getElementById('name-label').textContent = t.nameLabel;
  document.getElementById('notes-label').textContent = t.notesLabel;
  document.getElementById('order-notes').placeholder = t.notesPh;
  document.getElementById('send-label').textContent = t.sendBtn;
  document.getElementById('admin-link-text').textContent = t.adminLink;
  document.getElementById('admin-h-title').textContent = t.adminTitle;
  document.getElementById('admin-back-btn').textContent = t.backBtn;
  document.getElementById('admin-list-title').textContent = t.listTitle;
  document.getElementById('add-form-title').textContent = t.addTitle;
  document.getElementById('add-btn').textContent = t.addBtn;
  document.getElementById('lbl-wa').textContent = t.waLabel;
  document.getElementById('lbl-wa-hint').textContent = t.waHint;
}

function renderTabs(){
  const t = i18n[lang];
  const cats = [...new Set(products.filter(p=>p.active).map(p=>p.cat))];
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  cats.forEach((cat,i)=>{
    const el = document.createElement('button');
    el.className = 'tab'+(i===0?' active':'');
    el.textContent = t.cats[cat]||cat;
    el.onclick = ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('sec-'+cat)?.scrollIntoView({behavior:'smooth',block:'start'});
    };
    bar.appendChild(el);
  });
}

function renderProducts(){
  const t = i18n[lang];
  const cats = [...new Set(products.filter(p=>p.active).map(p=>p.cat))];
  const container = document.getElementById('product-sections');
  container.innerHTML = '';
  cats.forEach(cat=>{
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.id = 'sec-'+cat;
    sec.innerHTML = '<div class="section-title">'+(t.cats[cat]||cat)+'</div>';
    products.filter(p=>p.active&&p.cat===cat).forEach(p=>{
      const qty = cart[p.id]?.qty||0;
      const step = (unitSteps[p.unit]||[1])[0];
      const card = document.createElement('div');
      card.className = 'product-card'+(qty>0?' in-cart':'');
      card.id = 'card-'+p.id;
      const altName = pName(p)!==p.zh ? p.zh : '';
      card.innerHTML = `
        <div class="product-info">
          <div class="product-name">${pName(p)}</div>
          ${altName?`<div class="product-alt">${altName}</div>`:''}
          ${p.price?`<div class="product-price">RM ${parseFloat(p.price).toFixed(2)}</div>`:''}
        </div>
        <div class="qty-wrap">
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty(${p.id},-${step})">−</button>
            <div>
              <div class="qty-num" id="qty-${p.id}">${qty}</div>
              <div class="qty-unit">${pUnit(p.unit)}</div>
            </div>
            <button class="qty-btn" onclick="changeQty(${p.id},${step})">+</button>
          </div>
        </div>`;
      sec.appendChild(card);
    });
    container.appendChild(sec);
  });
}

function changeQty(id, delta){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  if(!cart[id]) cart[id] = {p, qty:0};
  cart[id].qty = Math.max(0, cart[id].qty+delta);
  if(cart[id].qty===0) delete cart[id];
  const el = document.getElementById('qty-'+id);
  if(el) el.textContent = cart[id]?.qty||0;
  const card = document.getElementById('card-'+id);
  if(card){
    if(cart[id]?.qty>0) card.classList.add('in-cart');
    else card.classList.remove('in-cart');
  }
  updateBadge();
}

function updateBadge(){
  document.getElementById('cart-badge').textContent = Object.keys(cart).length;
}

function openCart(){ renderCart(); document.getElementById('cart-panel').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeCart(){ document.getElementById('cart-panel').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }

function renderCart(){
  const t = i18n[lang];
  const container = document.getElementById('cart-items');
  const items = Object.values(cart);
  if(!items.length){
    container.innerHTML = '<div class="cart-empty">'+t.emptyCart+'</div>';
    document.getElementById('send-btn').disabled = true;
    return;
  }
  document.getElementById('send-btn').disabled = false;
  container.innerHTML = items.map(i=>`
    <div class="cart-item">
      <div>
        <div class="cart-item-name">${pName(i.p)}</div>
        <div class="cart-item-qty">${i.qty} ${pUnit(i.p.unit)}</div>
      </div>
    </div>`).join('');
}

function sendWhatsApp(){
  const t = i18n[lang];
  const waNum = document.getElementById('wa-number').value.trim() || '60123456789';
  const name = document.getElementById('customer-name').value.trim() || (lang==='zh'?'顾客':lang==='ms'?'Pelanggan':'Khách hàng');
  const notes = document.getElementById('order-notes').value.trim();
  const items = Object.values(cart);
  if(!items.length) return;
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const mappedItems = items.map(i=>({name:pName(i.p), qty:i.qty, unit:pUnit(i.p.unit)}));
  const msg = t.waMsg(name, timeStr, mappedItems, notes);
  window.open('https://wa.me/'+waNum+'?text='+encodeURIComponent(msg),'_blank');
}

function showAdmin(e){ e.preventDefault(); document.getElementById('main-view').style.display='none'; document.getElementById('admin-view').style.display='block'; renderAdminList(); }
function hideAdmin(){ document.getElementById('main-view').style.display='block'; document.getElementById('admin-view').style.display='none'; renderTabs(); renderProducts(); }

function renderAdminList(){
  const container = document.getElementById('admin-list');
  container.innerHTML = '';
  products.forEach(p=>{
    const row = document.createElement('div');
    row.className = 'admin-item';
    row.innerHTML = `
      <div class="admin-item-info">
        <div class="admin-item-name">${p.zh}</div>
        <div class="admin-item-sub">${p.ms} · ${p.vi} · ${p.cat==='vegetables'?'蔬菜':p.cat==='chilled'?'冷藏':'干货'}</div>
      </div>
      <button class="toggle-btn ${p.active?'on':''}" onclick="toggleProduct(${p.id})" title="${p.active?'上架中':'已下架'}"></button>
      <button class="del-btn" onclick="deleteProduct(${p.id})">🗑</button>`;
    container.appendChild(row);
  });
}

function toggleProduct(id){ const p=products.find(x=>x.id===id); if(p){p.active=!p.active; renderAdminList();} }
function deleteProduct(id){ if(!confirm('确定删除？/ Confirm delete? / Xác nhận xóa?')) return; products=products.filter(x=>x.id!==id); delete cart[id]; updateBadge(); renderAdminList(); }

function addProduct(){
  const zh = document.getElementById('new-name-zh').value.trim();
  if(!zh){ alert('请填写中文名称 / Sila isi nama / Vui lòng nhập tên'); return; }
  const ms = document.getElementById('new-name-ms').value.trim();
  const vi = document.getElementById('new-name-vi').value.trim();
  const price = document.getElementById('new-price').value;
  products.push({
    id: nextId++, zh,
    ms: ms||zh, vi: vi||zh,
    cat: document.getElementById('new-cat').value,
    unit: document.getElementById('new-unit').value,
    price: price, active: true
  });
  document.getElementById('new-name-zh').value='';
  document.getElementById('new-name-ms').value='';
  document.getElementById('new-name-vi').value='';
  document.getElementById('new-price').value='';
  renderAdminList();
}

applyLang();
renderTabs();
renderProducts();
</script>
</body>
</html>
