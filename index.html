<html lang="zh">

<meta charset="UTF-8">

<title>🥬 点单 · Order · Pesanan</title>

<style>
:root {
  --green:#16a34a;--green-light:#dcfce7;--green-dark:#14532d;
  --wa:#25D366;--bg:#f0faf3;--card:#ffffff;
  --border:#d1fae5;--border2:#e5e7eb;
  --text:#111827;--muted:#6b7280;
  --radius:14px;--radius-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);}
body{max-width:480px;margin:0 auto;min-height:100vh;}

.header{background:linear-gradient(135deg,#14532d 0%,#16a34a 100%);padding:18px 16px 14px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;}
.shop-name{font-size:18px;font-weight:800;color:white;letter-spacing:-0.3px;}
.shop-hours{font-size:12px;color:rgba(255,255,255,0.75);margin-top:2px;}
.cart-btn{background:var(--wa);color:white;border:none;border-radius:var(--radius-sm);padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;box-shadow:0 2px 8px rgba(37,211,102,0.4);}
.cart-badge{background:white;color:var(--wa);border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}

.lang-bar{display:flex;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);}
.lang-btn{flex:1;padding:8px 0;border:1.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;transition:all 0.15s;}
.lang-btn.active{background:var(--green);color:white;border-color:var(--green);}

.tab-bar{display:flex;overflow-x:auto;padding:0 16px;gap:4px;background:var(--card);border-bottom:1px solid var(--border);scrollbar-width:none;position:sticky;top:64px;z-index:40;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:11px 16px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit;background:none;border-top:none;border-left:none;border-right:none;transition:color 0.15s;}
.tab.active{color:var(--green);border-bottom-color:var(--green);}

.sections{padding:14px 16px 110px;}
.section{margin-bottom:22px;}
.section-title{font-size:11px;font-weight:800;color:var(--green);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

.product-card{background:var(--card);border:1.5px solid var(--border2);border-radius:var(--radius);padding:13px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;transition:border-color 0.15s,box-shadow 0.15s;}
.product-card.in-cart{border-color:var(--green);box-shadow:0 0 0 3px var(--green-light);}
.product-info{flex:1;min-width:0;}
.product-name{font-size:15px;font-weight:700;color:var(--text);}
.product-zh{font-size:12px;color:var(--muted);margin-top:2px;}
.product-price{font-size:12px;color:var(--green);font-weight:700;margin-top:3px;}

.qty-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
.qty-control{display:flex;align-items:center;gap:8px;}
.qty-btn{width:32px;height:32px;border:1.5px solid var(--border2);border-radius:50%;background:var(--bg);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);line-height:1;font-family:inherit;transition:all 0.1s;}
.qty-btn:active{background:var(--green-light);border-color:var(--green);transform:scale(0.9);}
.qty-num{min-width:28px;text-align:center;font-size:16px;font-weight:800;color:var(--text);}
.qty-unit{font-size:11px;color:var(--muted);text-align:center;font-weight:600;}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;backdrop-filter:blur(2px);}
.overlay.open{display:block;}
.cart-panel{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--border);padding:0 16px 28px;max-height:80vh;overflow-y:auto;z-index:101;}
.cart-panel.open{display:block;}
.cart-drag{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:14px auto 16px;}
.cart-header{font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.close-btn{background:var(--bg);border:1px solid var(--border2);border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
.cart-item-name{font-size:14px;font-weight:700;color:var(--text);}
.cart-item-qty{font-size:13px;color:var(--muted);margin-top:2px;font-weight:600;}
.cart-empty{text-align:center;color:var(--muted);padding:28px 0;font-size:15px;font-weight:600;}

.form-section{margin-top:14px;}
.form-label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;}
.form-input:focus{border-color:var(--green);}
.form-textarea{height:72px;resize:none;margin-top:8px;}

.send-btn{width:100%;background:var(--wa);color:white;border:none;border-radius:var(--radius);padding:15px;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;margin-top:14px;box-shadow:0 4px 14px rgba(37,211,102,0.35);transition:opacity 0.15s;}
.send-btn:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none;}
.send-btn:active:not(:disabled){opacity:0.85;}
.wa-svg{width:20px;height:20px;flex-shrink:0;}
.no-products{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;font-weight:600;}
</style>
</head>
<body>

  </div>
  <button class="cart-btn" onclick="openCart()">

    <span class="cart-badge" id="cart-badge">0</span>
  </button>

<div class="sections" id="product-sections"></div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>

let lang='zh',cart={},products=[],nextId=100;

function loadData(){
  try{
    const s=localStorage.getItem('kedai_products');
    if(s){products=JSON.parse(s);nextId=Math.max(...products.map(p=>p.id),99)+1;}
    else{products=[...DEFAULT_PRODUCTS];localStorage.setItem('kedai_products',JSON.stringify(products));}
  }catch(e){products=[...DEFAULT_PRODUCTS];}
}

function pName(p){return p[lang]||p.zh;}

function setLang(l,btn){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyLang();renderTabs();renderProducts();
}

function applyLang(){
  const t=i18n[lang];
  document.getElementById('h-title').textContent=t.title;
  document.getElementById('h-sub').textContent=t.sub;
  document.getElementById('h-cart').textContent=t.cart;
  document.getElementById('cart-title').textContent=t.cartTitle;
  document.getElementById('customer-name').placeholder=t.namePh;
  document.getElementById('name-label').textContent=t.nameLabel;
  document.getElementById('notes-label').textContent=t.notesLabel;
  document.getElementById('order-notes').placeholder=t.notesPh;
  document.getElementById('send-label').textContent=t.sendBtn;
}

function renderTabs(){
  const t=i18n[lang];
  const cats=[...new Set(products.filter(p=>p.active).map(p=>p.cat))];
  const bar=document.getElementById('tab-bar');bar.innerHTML='';
  cats.forEach((cat,i)=>{
    const el=document.createElement('button');
    el.className='tab'+(i===0?' active':'');
    el.textContent=t.cats[cat]||cat;
    el.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('sec-'+cat)?.scrollIntoView({behavior:'smooth',block:'start'});};
    bar.appendChild(el);
  });
}

function renderProducts(){
  const t=i18n[lang];
  const active=products.filter(p=>p.active);
  const cats=[...new Set(active.map(p=>p.cat))];
  const container=document.getElementById('product-sections');container.innerHTML='';
  if(!active.length){container.innerHTML='<div class="no-products">暂无商品</div>';return;}
  cats.forEach(cat=>{
    const sec=document.createElement('div');sec.className='section';sec.id='sec-'+cat;
    sec.innerHTML='<div class="section-title">'+(t.cats[cat]||cat)+'</div>';
    active.filter(p=>p.cat===cat).forEach(p=>{
      const qty=cart[p.id]?.qty||0;
      const step=(unitSteps[p.unit]||[1])[0];
      const card=document.createElement('div');
      card.className='product-card'+(qty>0?' in-cart':'');card.id='card-'+p.id;
      const displayName=pName(p);
      const showZH=lang!=='zh'&&p.zh!==displayName;
      card.innerHTML=`
        <div class="product-info">
          <div class="product-name">${displayName}</div>
          ${showZH?`<div class="product-zh">${p.zh}</div>`:''}
          ${p.price?`<div class="product-price">RM ${parseFloat(p.price).toFixed(2)}</div>`:''}
        </div>
        <div class="qty-wrap">
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty(${p.id},-${step})">−</button>
            <div><div class="qty-num" id="qty-${p.id}">${qty}</div><div class="qty-unit">${p.unit}</div></div>
            <button class="qty-btn" onclick="changeQty(${p.id},${step})">+</button>
          </div>
        </div>`;
      sec.appendChild(card);
    });
    container.appendChild(sec);
  });
}

function changeQty(id,delta){
  const p=products.find(x=>x.id===id);if(!p)return;
  if(!cart[id])cart[id]={p,qty:0};
  cart[id].qty=Math.max(0,cart[id].qty+delta);
  if(cart[id].qty===0)delete cart[id];
  const el=document.getElementById('qty-'+id);if(el)el.textContent=cart[id]?.qty||0;
  const card=document.getElementById('card-'+id);
  if(card){if(cart[id]?.qty>0)card.classList.add('in-cart');else card.classList.remove('in-cart');}
  updateBadge();
}

function updateBadge(){document.getElementById('cart-badge').textContent=Object.keys(cart).length;}
function openCart(){renderCart();document.getElementById('cart-panel').classList.add('open');document.getElementById('overlay').classList.add('open');}
function closeCart(){document.getElementById('cart-panel').classList.remove('open');document.getElementById('overlay').classList.remove('open');}

function renderCart(){
  const t=i18n[lang];
  const container=document.getElementById('cart-items');
  const items=Object.values(cart);
  if(!items.length){container.innerHTML='<div class="cart-empty">'+t.emptyCart+'</div>';document.getElementById('send-btn').disabled=true;return;}
  document.getElementById('send-btn').disabled=false;
  // 购物车显示当前语言
  container.innerHTML=items.map(i=>`<div class="cart-item"><div><div class="cart-item-name">${pName(i.p)}</div><div class="cart-item-qty">${i.qty} ${i.p.unit}</div></div></div>`).join('');
}

function sendWhatsApp(){
  const waNum=localStorage.getItem('kedai_wa')||'60123456789';
  const name=document.getElementById('customer-name').value.trim()||(lang==='zh'?'顾客':lang==='ms'?'Pelanggan':'Khách hàng');
  const notes=document.getElementById('order-notes').value.trim();
  const items=Object.values(cart);if(!items.length)return;
  const now=new Date();
  const time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');

  // ✅ 订单永远用中文发给档主，不管客户用什么语言
  let msg=`📦 *新订单*\n👤 ${name}\n🕐 ${time}\n━━━━━━━━━━━━━━\n`;
  items.forEach(i=>{msg+=`• ${i.p.zh}：${i.qty} ${i.p.unit}\n`;});
  msg+=`━━━━━━━━━━━━━━`;
  if(notes)msg+=`\n📝 ${notes}`;
  msg+=`\n请确认 🙏`;
  window.open('https://wa.me/'+waNum+'?text='+encodeURIComponent(msg),'_blank');
}

loadData();applyLang();renderTabs();renderProducts();
</script>
